publish:
  image: python:3.11
  script:
    - pip install --upgrade pip
    - pip install flit build twine

    # Extract base version from pyproject.toml
    - BASE_VERSION=$(grep '^version =' pyproject.toml | cut -d '"' -f2)
    - echo "Base version: $BASE_VERSION"

    # Compose final version (PEP 440 local version)
    - FINAL_VERSION="${BASE_VERSION}+${CI_COMMIT_TAG}"
    - echo "Final version: $FINAL_VERSION"

    # Replace version in pyproject.toml
    - sed -i "s/^version = .*/version = \"$VERSION\"/" pyproject.toml

    # Build package
    - python -m build

    # Upload to GitLab PyPI
    - python -m twine upload \
      --repository-url "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/pypi" \
      -u gitlab-ci-token \
      -p $CI_JOB_TOKEN \
      dist/*

  artifacts:
    paths:
      - dist/

  rules:
    - if: $CI_COMMIT_TAG
